name: finagent-codex

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: finagent-codex
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      WEBUI_HOST: 0.0.0.0
      API_PORT: "8000"
      ADMIN_AUTH_ENABLED: "true"
      AGENT_MODE: "true"
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./.env:/app/.env
      - ./strategies:/app/strategies:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

